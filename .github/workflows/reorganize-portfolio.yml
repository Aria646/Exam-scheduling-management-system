name: Reorganize portfolio source tree

on:
  push:
    paths:
      - '.github/workflows/reorganize-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reorganize Java source files by package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          moved=0
          for file in *.java; do
            pkg=$(sed -n 's/^package[[:space:]]\+\([^;]*\);.*/\1/p' "$file" | head -n1)
            if [ -z "$pkg" ]; then
              echo "Skipping $file: no package declaration"
              continue
            fi
            pkg_path=${pkg//./\/}
            if [[ "$file" == *Test.java ]]; then
              dest="src/test/java/$pkg_path"
            else
              dest="src/main/java/$pkg_path"
            fi
            mkdir -p "$dest"
            git mv "$file" "$dest/$file"
            moved=1
          done
          if [ "$moved" -eq 0 ]; then
            echo "No root-level Java files to move."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganize Java project structure"
          git push
